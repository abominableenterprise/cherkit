# Pinned versions. Bump them in a dedicated PR.
[versions]
kotlin = "2.3.21"
agp = "9.0.1"
kotlinx-serialization-json = "1.9.0"
coroutines = "1.10.2"
posthog-android = "3.61.1"
firebase-bom = "35.1.0"
# Optional Android attribution SDK compile baselines; consuming apps own runtime versions.
revenuecat-purchases = "9.29.1"
meta-facebook-core = "19.0.1"
android-compileSdk = "36"
android-minSdk = "24"
# Compose for :sunset-compose. A low, stable floor: Gradle resolves the app's newer androidx Compose (or the one
# Compose Multiplatform 1.11.x brings) over these, so the library never forces an upgrade.
compose = "1.9.5"
compose-material3 = "1.4.0"
robolectric = "4.16.1"
junit = "4.13.2"
espresso = "3.5.0"
# Play In-App Review for :review-compose (Android only).
play-review = "2.0.2"
# Play In-App Updates for :update-compose (Android only). activity-compose: rememberLauncherForActivityResult for
# the flexible flow; 1.7.0 is the activity version Compose ui 1.9.5 already brings, so it forces no upgrade.
play-app-update = "2.1.0"
activity-compose = "1.7.0"

[libraries]
# Optional Android telemetry provider; versions come from the consumer's BoM.
firebase-bom = { module = "com.google.firebase:firebase-bom", version.ref = "firebase-bom" }
firebase-crashlytics = { module = "com.google.firebase:firebase-crashlytics" }
firebase-perf = { module = "com.google.firebase:firebase-perf" }
# Compile-only attribution SDKs; not published as runtime dependencies.
revenuecat-purchases = { module = "com.revenuecat.purchases:purchases", version.ref = "revenuecat-purchases" }
meta-facebook-core = { module = "com.facebook.android:facebook-core", version.ref = "meta-facebook-core" }
kotlin-test = { module = "org.jetbrains.kotlin:kotlin-test", version.ref = "kotlin" }
kotlinx-serialization-json = { module = "org.jetbrains.kotlinx:kotlinx-serialization-json", version.ref = "kotlinx-serialization-json" }
kotlinx-coroutines-core = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-core", version.ref = "coroutines" }
kotlinx-coroutines-test = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-test", version.ref = "coroutines" }
compose-runtime = { module = "androidx.compose.runtime:runtime", version.ref = "compose" }
compose-ui = { module = "androidx.compose.ui:ui", version.ref = "compose" }
compose-ui-tooling-preview = { module = "androidx.compose.ui:ui-tooling-preview", version.ref = "compose" }
compose-foundation = { module = "androidx.compose.foundation:foundation", version.ref = "compose" }
compose-material3 = { module = "androidx.compose.material3:material3", version.ref = "compose-material3" }
compose-ui-test-junit4 = { module = "androidx.compose.ui:ui-test-junit4", version.ref = "compose" }
compose-ui-test-manifest = { module = "androidx.compose.ui:ui-test-manifest", version.ref = "compose" }
robolectric = { module = "org.robolectric:robolectric", version.ref = "robolectric" }
junit = { module = "junit:junit", version.ref = "junit" }
androidx-test-espresso-core = { module = "androidx.test.espresso:espresso-core", version.ref = "espresso" }
play-review-ktx = { module = "com.google.android.play:review-ktx", version.ref = "play-review" }
play-app-update-ktx = { module = "com.google.android.play:app-update-ktx", version.ref = "play-app-update" }
androidx-activity-compose = { module = "androidx.activity:activity-compose", version.ref = "activity-compose" }
# Catalog entry only; the analytics module adds it in its own PR.
posthog-android = { module = "com.posthog:posthog-android", version.ref = "posthog-android" }

[plugins]
kotlin-multiplatform = { id = "org.jetbrains.kotlin.multiplatform", version.ref = "kotlin" }
kotlin-serialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }
kotlin-compose = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
android-kotlin-multiplatform-library = { id = "com.android.kotlin.multiplatform.library", version.ref = "agp" }
